# Builds the Android APK from source and publishes it to GitHub Releases.
#
# Triggers:
#   - Push of a version tag (v*) -- creates a production release
#   - workflow_dispatch           -- manual trigger for ad-hoc releases
#
# Required secrets (set in repo Settings -> Secrets and variables -> Actions):
#   PUBLIK_APP_TOKEN           the publik app token (pat_lunara_...); the build
#                              fails when it is empty or not a token
#   ANDROID_KEYSTORE_BASE64    base64-encoded release keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# It publishes the signed release APK only. It never publishes a debug APK
# (a debug build is for tests: mobile-test-builds.yml). Without all four
# ANDROID_KEYSTORE_* secrets the workflow fails before it builds anything.
# The web bundle is a release build (LUNARA_RELEASE=1): no publik test hooks,
# and the app token comes from the secret only (app/src/lib/buildCheck.ts).
# The publik gate is always required in a release build (vite build refuses
# PUBLIK_GATE_MODE=optional together with LUNARA_RELEASE=1).

name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: true
      draft:
        description: "Save as draft?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # ── Resolve release tag ───────────────────────────────────────────────
      - name: Set RELEASE_TAG
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.tag_name }}" >> "$GITHUB_ENV"
          fi

      # ── Decide whether we have a real release keystore ──────────────────────
      # Secrets can't be read directly in step `if:` conditions reliably, so we
      # resolve this once into a plain env var and gate every signing-related
      # step off that instead.
      - name: Check the release secrets
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLIK_APP_TOKEN" ]; then
            echo "::error::The PUBLIK_APP_TOKEN secret is empty. A release needs the publik app token."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets are not all set. A release publishes a signed APK only, never a debug APK."
            exit 1
          fi

      # ── Node.js + pnpm ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: "12.8.1"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4.2.3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Java & Android SDK ────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME). android-actions/setup-android
      # v3.2.2 fails there: its sdkmanager call asks for the removed "tools" package.
      - name: Show the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Cache Gradle files
        uses: gradle/actions/setup-gradle@v4.4.1
        with:
          gradle-home-cache-cleanup: true

      # ── Run test suite ────────────────────────────────────────────────────
      - name: Run test suite
        run: pnpm test

      # ── Build web bundle & sync to Android ────────────────────────────────
      - name: Build web bundle (native mode, release)
        working-directory: app
        env:
          LUNARA_RELEASE: "1"
          VITE_PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
          PUBLIK_GATE_MODE: required
        run: |
          pnpm build:native
          echo "Bundle: $(cat dist/lunara-build.json)"

      - name: Sync web assets into Android project
        working-directory: app
        run: npx cap sync android

      # ── Keystore setup ───────────────────────────────────────────────────
      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/lunara.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ── Build the APK ─────────────────────────────────────────────────────
      # app/android/app/build.gradle wires up the signingConfig from these
      # -Pandroid.injected.signing.* properties. The release build type never
      # has the publik test hooks (BuildConfig.PUBLIK_TEST_HOOKS is false).
      - name: Build signed Release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # ── Stage release assets ──────────────────────────────────────────────
      - name: Rename the APK and generate checksums
        run: |
          RELEASE_APK="Lunara.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > SHA256SUMS.txt
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      # ── Release notes ─────────────────────────────────────────────────────
      - name: Write release notes
        run: |
          cat > RELEASE_BODY.md <<EOF
          ## Install on Android

          1. Download **${RELEASE_APK}** below.
          2. On your Android phone go to **Settings → Install unknown apps** and allow your browser or file manager to install APKs.
          3. Open the downloaded file and tap **Install**.

          > **Note:** This APK is sideloaded — it is not from the Google Play Store.
          > Verify the download with \`SHA256SUMS.txt\` if you want to confirm integrity.

          ---
          *Built from [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) by GitHub Actions.*
          EOF

      # ── Upload to workflow artifacts (always accessible) ──────────────────
      - name: Upload the APK to workflow artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lunara-apk-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.RELEASE_APK }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      # ── Publish GitHub Release ────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Lunara ${{ env.RELEASE_TAG }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          files: |
            ${{ env.RELEASE_APK }}
            SHA256SUMS.txt
